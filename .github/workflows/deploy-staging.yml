name: Deploy staging

# Every push to main deploys the staging Worker (claude-strudel-staging).
# Gated on the repo variable DEPLOY_ENABLED so the repo stays green until
# Cloudflare is provisioned: Settings -> Secrets and variables -> Actions ->
# Variables -> DEPLOY_ENABLED = true. Needs repo secrets CLOUDFLARE_API_TOKEN and
# CLOUDFLARE_ACCOUNT_ID. Worker secrets (ANTHROPIC_API_KEY etc.) are set once
# with `wrangler secret put X --env staging` - see README.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: staging
    steps:
      - uses: actions/checkout@v7

      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version: '24'
          cache: true

      # CLOUDFLARE_ENV picks env.staging from wrangler.jsonc at build time; the
      # Cloudflare Vite plugin writes the resolved config that `wrangler deploy` uses.
      - name: Build (staging)
        run: vp build
        env:
          CLOUDFLARE_ENV: staging

      - name: Deploy worker (staging)
        uses: cloudflare/wrangler-action@v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
