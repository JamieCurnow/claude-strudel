name: CI

# Every PR and every push to main: format + lint + type-aware checks (Vite+),
# vue-tsc for the SFCs, unit tests, and a full production build of the SPA +
# Worker bundle. Deploys live in deploy-*.yml.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version: '24'
          cache: true

      - name: Check (fmt + lint + types)
        run: vp check

      - name: Typecheck Vue SFCs
        run: npx vue-tsc -b

      - name: Unit tests
        run: vp test

      - name: Build (SPA + Worker)
        run: vp build

      - name: Wrangler dry-run deploy
        run: npx wrangler deploy --dry-run
