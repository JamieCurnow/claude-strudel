name: Deploy production

# Manual only: Actions -> "Deploy production" -> Run workflow (add required
# reviewers on the `production` GitHub Environment for an approval gate).
#
#   1. Fast-forward `releases/production` to `main`, so that branch always
#      points at exactly what is live (`git log releases/production` = deploy log).
#   2. Build with CLOUDFLARE_ENV=production and deploy the Worker.
on:
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: production
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Fast-forward releases/production to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git ls-remote --exit-code --heads origin releases/production >/dev/null; then
            git fetch origin releases/production:releases/production
            git checkout releases/production
            # Refuse to deploy if prod has commits that aren't on main (a hotfix
            # pushed straight to the release branch). Reconcile by hand.
            git merge --ff-only main
          else
            git checkout -B releases/production main
          fi
          git push origin releases/production

      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version: '24'
          cache: true

      - name: Build (production)
        run: vp build
        env:
          CLOUDFLARE_ENV: production

      - name: Deploy worker (production)
        uses: cloudflare/wrangler-action@v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
